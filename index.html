<!doctype html>
<html lang="en">

    <meta name="title" content="CRAVZO - Food Delivery | Order Online" />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cravzo.shop/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cravzo.shop/" />

    <!-- Twitter -->

    <meta name="twitter:title" content="CRAVZO - Food Delivery" />
    <meta name="twitter:description" content="Order food from your favorite restaurants with fast delivery." />
    <meta name="twitter:image" content="https://cravzo.shop/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/cravzologo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="msapplication-TileColor" content="#4f46e5" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CRAVZO",
      "url": "https://cravzo.shop",
      "logo": "https://cravzo.shop/logo.png",

      "sameAs": [
        "https://instagram.com/cravzo",
        "https://twitter.com/cravzo"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-XXXXXXXXXX",
        "contactType": "customer service"
      }
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CRAVZO",
      "url": "https://cravzo.shop",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cravzo.shop/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <link rel="stylesheet" href="./src/index.css" />
