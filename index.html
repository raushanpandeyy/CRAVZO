<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5"
    />

    <!-- Primary SEO -->
    <title>Dodago - Affordable Food Delivery in Delhi NCR</title>

    <meta
      name="title"
      content="Dodago - Affordable Food Delivery in Delhi NCR"
    />

    <meta
      name="description"
      content="Dodago is an affordable food delivery platform with transparent pricing, fast delivery, and lower restaurant costs across Delhi NCR."
    />

    <meta
      name="keywords"
      content="Dodago, affordable food delivery, food delivery India, online food order, restaurant delivery app, cheap food delivery, Delhi NCR food delivery, student delivery partners, low commission food delivery"
    />

    <meta name="author" content="DODAGO" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <link rel="canonical" href="https://dodago.shop/" />

    <!-- Geo SEO -->
    <meta name="geo.region" content="IN-DL" />
    <meta name="geo.placename" content="Delhi NCR" />
    <meta name="language" content="English" />

    <!-- Additional SEO -->
    <meta name="distribution" content="global" />
    <meta name="revisit-after" content="1 day" />
    <meta name="rating" content="general" />

    <!-- Theme -->
    <meta name="theme-color" content="#5b21b6" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta name="apple-mobile-web-app-title" content="DODAGO" />
    <meta name="application-name" content="DODAGO" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://dodago.shop/" />

    <meta
      property="og:title"
      content="Dodago - Affordable Food Delivery"
    />

    <meta
      property="og:description"
      content="Affordable food delivery with transparent pricing and fast delivery across Delhi NCR."
    />

    <meta
      property="og:image"
      content="https://dodago.shop/og-image.png"
    />

    <meta property="og:site_name" content="DODAGO" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:url" content="https://dodago.shop/" />

    <meta
      name="twitter:title"
      content="Dodago - Affordable Food Delivery"
    />

    <meta
      name="twitter:description"
      content="Order food online with lower prices and transparent delivery charges."
    />

    <meta
      name="twitter:image"
      content="https://dodago.shop/og-image.png"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/dodagologo.svg" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Non-blocking Inter font -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=optional"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=optional"
        rel="stylesheet"
      />
    </noscript>

    <!-- Non-blocking Poppins font (used sparingly, preloaded for instant swap) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Cloudinary -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- API & WebSocket - preconnect to reduce connection latency -->
    <link rel="preconnect" href="https://dodago.shop" />
    <link rel="preconnect" href="https://api.dodago.shop" />

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DODAGO",
        "url": "https://dodago.shop",
        "logo": "https://dodago.shop/logo.png",
        "description": "Affordable food delivery platform in India with transparent pricing and restaurant-friendly subscriptions.",
        "sameAs": [
          "https://instagram.com/dodago",
          "https://twitter.com/dodago",
          "https://facebook.com/dodago"
        ],
        "areaServed": "India",
        "serviceType": "Food Delivery"
      }
    </script>

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DODAGO",
        "url": "https://dodago.shop",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://dodago.shop/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Local Business Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "DODAGO",
        "image": "https://dodago.shop/dodagologo.png",
        "url": "https://dodago.shop",
        "description": "Online food delivery platform serving Delhi NCR with affordable pricing and fast delivery.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN",
          "addressRegion": "Delhi NCR"
        },
        "priceRange": "₹",
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "00:00",
          "closes": "23:59"
        }
      }
    </script>

    <!-- Preload critical JS chunks (browser discovers main.jsx + deps before parsing them) -->
    <link rel="modulepreload" href="/src/main.jsx" />

    <!-- Styles -->
    <link rel="stylesheet" href="./src/index.css" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
