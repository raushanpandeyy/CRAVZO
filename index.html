<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>CRAVZO - Food Delivery | Order Online</title>
    <meta name="title" content="CRAVZO - Food Delivery | Order Online" />
    <meta name="description" content="Order food from your favorite restaurants with fast delivery. Browse restaurants, explore menus, and get food delivered to your doorstep." />
    <meta name="keywords" content="food delivery, online ordering, restaurants, fast food, pizza, biryani, delivery, crave, hungry" />
    <meta name="author" content="CRAVZO" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://cravzo.shop/" />
    
    <!-- Geo Tags -->
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta name="language" content="English" />
    
    <!-- Additional SEO -->
    <meta name="distribution" content="global" />
    <meta name="revisit-after" content="1 day" />
    <meta name="rating" content="general" />
    
    <!-- Business/Local SEO -->
    <meta property="business:contact_data:street_address" content="" />
    <meta property="business:contact_data:locality" content="India" />
    <meta property="business:contact_data:country" content="India" />
    <meta property="business:contact_data:email" content="support@cravzo.shop" />
    <meta property="business:contact_data:phone_number" content="" />
    <meta property="business:contact_data:website" content="https://cravzo.shop" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cravzo.shop/" />
    <meta property="og:title" content="CRAVZO - Food Delivery" />
    <meta property="og:description" content="Order food from your favorite restaurants with fast delivery. Download CRAVZO app now!" />
    <meta property="og:image" content="https://cravzo.shop/og-image.png" />
    <meta property="og:site_name" content="CRAVZO" />
    <meta property="og:locale" content="en_IN" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cravzo.shop/" />
    <meta name="twitter:title" content="CRAVZO - Food Delivery" />
    <meta name="twitter:description" content="Order food from your favorite restaurants with fast delivery." />
    <meta name="twitter:image" content="https://cravzo.shop/og-image.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/cravzologo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRAVZO" />
    <meta name="application-name" content="CRAVZO" />
    <meta name="msapplication-TileColor" content="#4f46e5" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CRAVZO",
      "url": "https://cravzo.shop",
      "logo": "https://cravzo.shop/logo.png",
      "description": "CRAVZO - Food delivery platform connecting customers with local restaurants in India. Order pizza, biryani, burgers, and more from your favorite restaurants.",
      "sameAs": [
        "https://instagram.com/cravzo",
        "https://twitter.com/cravzo",
        "https://facebook.com/cravzo"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-XXXXXXXXXX",
        "contactType": "customer service",
        "availableHours": "24/7"
      },
      "areaServed": "India",
      "serviceType": "Food Delivery"
    }
    </script>

    <!-- LocalBusiness Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "CRAVZO",
      "image": "https://cravzo.shop/cravzologo.png",
      "url": "https://cravzo.shop",
      "description": "Online food delivery service in India. Order food from restaurants near you.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN",
        "addressRegion": "India"
      },
      "priceRange": "₹",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      }
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CRAVZO",
      "url": "https://cravzo.shop",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://cravzo.shop/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
